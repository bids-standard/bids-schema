name: Inject

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inject.yml'
  workflow_dispatch:

permissions:
  contents: write
  # `bids-schema collect prs` uses `gh api graphql` to read PR activity
  # (reviews, comments, review threads) from bids-standard/bids-specification.
  pull-requests: read
  issues: read

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name bids-maintenance
          git config --global user.email bids.maintenance@gmail.com

      - name: Install git-annex and datalad
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install datalad git-annex

      - name: Install bids-schema (CLI + dependencies)
        run: |
          python3 -m pip install -e '.[ci]'

      - name: Run cron job
        env:
          # `gh` CLI reads GH_TOKEN (or GITHUB_TOKEN) from env when
          # running inside a GitHub Actions workflow — it doesn't
          # auto-pick up the actions/checkout token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `bids-schema collect bep-docs` uses a Google Drive API key to
          # read BEP Google Docs' modifiedTime/version (publicly-viewable
          # docs only). Missing/unset degrades gracefully — the collector
          # logs a warning and leaves doc_activity as "not checked yet".
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          tools/inject-schema-fully-auto

      - name: Possibly push results
        run:
          git push
